name: Build schedule-worker to package

 
on:
  push:
    branches:
      - release*
  create:
    branches:
      - release*
  pull_request:
  workflow_dispatch:
  
env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}/schedule-worker
    MAJOR_VERSION: 1 

jobs:
  build-schedule-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6.15.0
        with:
          context: .
          file: cmd/workers/schedule_updater/Dockerfile
          push: true
          tags: |
           ${{env.REGISTRY}}/${{ env.IMAGE_NAME }}:${{ env.MAJOR_VERSION }}.${{ github.run_number }}
           ${{env.REGISTRY}}/${{ env.IMAGE_NAME }}:latest
          labels: ${{ steps.meta.outputs.labels }}
