global:
  scrape_interval:     5s
  evaluation_interval: 5s


scrape_configs:
  - job_name: 'prometheus'
    scrape_interval: 10s
    scrape_timeout: 10s
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'homeworkmanager'
    static_configs:
      - targets: ['host.docker.internal:8889']

  - job_name: 'server'
    static_configs:
      - targets: [ 'host.docker.internal:9101' ]
